<style>

  .card h2 { margin: 0 0 8px; font-size: 22px; color: #fff3b0; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb3cf; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; }

  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #fff3b0; color: #4a1d3a; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: #ffffff22; border: 2px solid #ffffff77; pointer-events: none; }

<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><div id="score"></div></div>

</div></div>
<script>
/* ═══ PILLOW FORT WAR · a Multiplayer Agent starter ════════════════════════════════════
 * Two teams build pillow forts in a living room, then have a pillow fight: throw pillows
 * over the forts, grab the other team's flag and carry it home. Versus, 2–8; bots fill.
 * A match: BUILD (place cushions on your side) → FIGHT (first to CONFIG.capsToWin flags,
 * or the most when time runs out) → results → a new match.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ teams, timings, cushions, throwing, knockback, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   LIVING ROOM ... the grid, furniture, the two flag bases, what blocks what
 *   FORTS ......... the cushions: one shared string, one letter per cell
 *   PILLOWS ....... thrown pillows flying in an arc, forts stopping them, getting hit
 *   MATCH (HOST) .. phases, teams, seats, building, flags, captures, cushion damage. Only the host writes these.
 *   BOTS (HOST) ... building their fort, then attackers go for the flag, defenders guard it, everyone throws
 *   ME ............ moving, throwing, getting bonked. Each player writes only its own.
 *   DRAW .......... camera, the room, cushions, flags, kids in pajamas, pillows, feathers
 *   HUD & RESULTS . score, timer, hints, results card, leaderboard
 *   INPUT ......... WASD + mouse; on touch a move stick (left) and drag-to-aim (right)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, speed, aim,
 *     hearts, state, how many times it has been hit and by whom) about 15 times a second,
 *     `hb` (heartbeat) once a second, and `n`/`c` (name, nightcap color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     timers, teams, score, both flags, captures, hits), `fort` (every cushion: one letter
 *     per cell) and `bots`. A new host adopts all of it and carries on.
 *   - Building: you send "place" {c} / "take" {c} (a cell); the host checks it's your side
 *     and your team has cushions left, then writes `fort`. Yours shows at once until then.
 *   - THROWS ARE DECIDED BY THE VICTIM. A throw is an event "throw" {i, x, y, tx, ty, tm}:
 *     every screen flies the same pillow. Each player checks pillows against its OWN body;
 *     if one bonks it, it knocks itself back, loses a heart and sends "hit" {i} so the
 *     pillow vanishes everywhere. The host does the same for its bots.
 *   - FORTS AND FLAGS ARE HOST-RUN: the host flies every pillow too and decides which
 *     cushion it squashes. It also checks where everyone is and decides who took, dropped,
 *     returned or captured a flag. Getting bonked while carrying the flag drops it.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "pillow-points": 5 per flag captured + 1 per bonk, after each match.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,              // bots fill each team up to seats / 2 kids
  buildMs: 25000,        // building time
  fightMs: 150000,       // pillow fight time
  overMs: 11000,         // results before the next match
  capsToWin: 3,          // flags captured that win the match
  teamCushions: 26,      // cushions each team can place
  cushionHp: 3,          // pillow hits a cushion takes before it flops over
  speed: 230,            // walking speed, px/s
  carrySpeed: 185,       // speed while carrying the flag
  radius: 18,            // a kid's body radius
  throwRange: 470,       // the farthest a pillow lands, px
  throwSpeed: 640,       // how fast a pillow travels across the floor, px/s
  arc: 0.22,             // how high pillows fly: peak height = distance × this
  throwCd: 0.45,         // seconds between throws
  lowZ: 46,              // pillows lower than this bonk kids (a high lob only hits where it lands)
  cushionH: 32,          // ... and enemy cushions lower than this
  furnH: 40,             // ... and furniture
  hitR: 28,              // how close a pillow must pass to bonk you
  knock: 430,            // knockback speed, px/s
  stun: 0.35,            // after a bonk you can barely move or throw (s)
  hearts: 3,             // bonks before you flop over
  flopMs: 1700,          // how long you lie there before running back from your base
  regenMs: 4000,         // a heart comes back after this long without a bonk
  flagR: 34,             // how close you must get to touch a flag
  dropReturnMs: 10000,   // a dropped flag goes home after this long
  botThrowCd: [0.75, 1.4], // bots wait this long between throws (s)
  botAim: 50,            // how far off a bot's aim can be (px)
  board: "pillow-points",
};
const TEAMS = [
  { name: "Blankets", color: "#4d8cff", light: "#bcd6ff", dark: "#2a5bc0", cushion: "#8fb6ff" },
  { name: "Pajamas", color: "#ff5f8f", light: "#ffc3d6", dark: "#c0335f", cushion: "#ff9cbc" },
];
const BOT_NAMES = ["Pip", "Bean", "Lulu", "Ziggy", "Momo", "Taffy", "Nugget", "Poppy", "Sprout", "Button", "Biscuit", "Kiki"];
const CAPS = ["#ffd23f", "#52d273", "#b47dff", "#ff8c42", "#3de0d0", "#f8fafc", "#a3e635", "#e879f9", "#60a5fa", "#ff6b6b"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'pillow-fort',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} }, dropped = false;
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const isBot = (id) => id[0] === "@"; // bot ids look like "@3"; sessionIds never have an @
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ── LIVING ROOM ─────────────────────────────────────────────────────────────────────
// A 32 × 20 grid of 50px cells. Furniture fills cells (mirrored left/right so it's fair);
// Blankets build on the left (columns 0–12), Pajamas on the right (19–31); the middle is open.
const CELL = 50, GW = 32, GH = 20, WW = GW * CELL, WH = GH * CELL;
const BASES = [{ x: 2.5 * CELL, y: 10 * CELL }, { x: WW - 2.5 * CELL, y: 10 * CELL }];
const HALF = [(cx) => cx <= 12, (cx) => cx >= GW - 13];
const LEFT_FURNITURE = [
  { t: "shelf", x: 4, y: 0, w: 3, h: 1 }, { t: "chair", x: 7, y: 3, w: 2, h: 2 }, { t: "lamp", x: 11, y: 6, w: 1, h: 1 },
  { t: "sofa", x: 6, y: 16, w: 4, h: 2 }, { t: "plant", x: 0, y: 0, w: 1, h: 1 }, { t: "plant", x: 0, y: 19, w: 1, h: 1 }, { t: "plant", x: 12, y: 13, w: 1, h: 1 },
];
const FURNITURE = [...LEFT_FURNITURE, ...LEFT_FURNITURE.map((f) => ({ ...f, x: GW - f.x - f.w, flip: true })), { t: "tv", x: 14, y: 0, w: 4, h: 1 }, { t: "table", x: 15, y: 9, w: 2, h: 2 }];
const SOLID = new Uint8Array(GW * GH); // 1 = furniture
for (const f of FURNITURE) for (let y = f.y; y < f.y + f.h; y++) for (let x = f.x; x < f.x + f.w; x++) SOLID[y * GW + x] = 1;
const cellOf = (x, y) => { const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL); return cx < 0 || cy < 0 || cx >= GW || cy >= GH ? -1 : cy * GW + cx; };
const cellCenter = (c) => ({ x: (c % GW) * CELL + CELL / 2, y: Math.floor(c / GW) * CELL + CELL / 2 });
/** Can `team` put a cushion in cell c? On its side, not on furniture, not crowding a flag. */
function canBuild(team, c) {
  if (c < 0 || c >= GW * GH || SOLID[c] || !HALF[team](c % GW)) return false;
  const p = cellCenter(c); return dist(p, BASES[team]) > 105;
}
/** Is the cell blocked for walking (furniture or any cushion)? */
const blocked = (c, fort) => c < 0 || SOLID[c] === 1 || fort[c] !== ".";
/** Push a kid (circle) out of every blocked cell around it and keep it in the room. */
function collide(b, fort) {
  const r = CONFIG.radius;
  for (let pass = 0; pass < 2; pass++) {
    const x0 = Math.floor((b.x - r) / CELL), x1 = Math.floor((b.x + r) / CELL), y0 = Math.floor((b.y - r) / CELL), y1 = Math.floor((b.y + r) / CELL);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      if (cx >= 0 && cy >= 0 && cx < GW && cy < GH && !blocked(cy * GW + cx, fort)) continue;
      const nx = clamp(b.x, cx * CELL, cx * CELL + CELL), ny = clamp(b.y, cy * CELL, cy * CELL + CELL), dx = b.x - nx, dy = b.y - ny, d = Math.hypot(dx, dy);
      if (d < r && d > 1e-4) { b.x = nx + (dx / d) * r; b.y = ny + (dy / d) * r; } else if (d <= 1e-4) { b.y += r; }
    }
  }
  b.x = clamp(b.x, r, WW - r); b.y = clamp(b.y, r, WH - r);
}
const spawnFor = (team, i) => ({ x: BASES[team].x + (team ? -1 : 1) * (40 + (i % 2) * 30), y: BASES[team].y + ((i % 5) - 2) * 44 });

// ── FORTS ───────────────────────────────────────────────────────────────────────────
// `fort` = "m<match id>|" + one letter per cell: "." empty; A B C = a Blankets cushion with
// 3 2 1 hearts; X Y Z = a Pajamas cushion with 3 2 1 hearts. Letters, never digits.
const FORT_CH = [["C", "B", "A"], ["Z", "Y", "X"]]; // [team][hearts - 1]
const EMPTY_FORT = ".".repeat(GW * GH);
const cushionOf = (ch) => { for (let t = 0; t < 2; t++) { const i = FORT_CH[t].indexOf(ch); if (i >= 0) return { team: t, hp: i + 1 }; } return null; };
/** The fort for this match as an array of letters (the host's own copy while it's host). */
function fortNow() {
  const g = game(); if (!g) return EMPTY_FORT;
  return isHost() && host.fortId === g.id ? host.fort : sharedFort(g);
}
/** The fort as state has it (empty if it belongs to another match). */
function sharedFort(g) {
  const raw = S.shared.fort; if (typeof raw !== "string") return EMPTY_FORT;
  const bar = raw.indexOf("|"); return raw.slice(0, bar) === "m" + g.id && raw.length - bar - 1 === GW * GH ? raw.slice(bar + 1) : EMPTY_FORT;
}
const teamCount = (fort, team) => { let n = 0; for (const ch of fort) if (FORT_CH[team].includes(ch)) n++; return n; };

// ── PILLOWS ─────────────────────────────────────────────────────────────────────────
// Every screen flies every pillow from its "throw" event: a straight line across the floor
// with a height z that rises and falls. Enemy cushions and furniture stop low pillows.
const pillows = [], feathers = [];
let pillowSeq = 0;
function spawnPillow(m) {
  if (pillows.some((p) => p.i === m.i)) return null;
  const d = Math.hypot(m.tx - m.x, m.ty - m.y), p = { i: m.i, by: m.by, tm: m.tm, x0: m.x, y0: m.y, tx: m.tx, ty: m.ty, x: m.x, y: m.y, z: 20, t: 0,
    dur: Math.max(0.12, d / CONFIG.throwSpeed), peak: d * CONFIG.arc, dx: (m.tx - m.x) / (d || 1), dy: (m.ty - m.y) / (d || 1), state: "fly", left: 0, rot: Math.random() * 6 };
  pillows.push(p); return p;
}
function stepPillows(dt, fort) {
  for (let i = pillows.length - 1; i >= 0; i--) {
    const p = pillows[i];
    if (p.state !== "fly") { p.left -= dt; if (p.left <= 0) pillows.splice(i, 1); continue; }
    p.t += dt; const s = Math.min(1, p.t / p.dur);
    p.x = p.x0 + (p.tx - p.x0) * s; p.y = p.y0 + (p.ty - p.y0) * s; p.z = 20 * (1 - s) + 4 * p.peak * s * (1 - s); p.rot += dt * 9;
    const c = cellOf(p.x, p.y), cu = c >= 0 ? cushionOf(fort[c]) : null;
    const stop = c < 0 || (SOLID[c] && p.z < CONFIG.furnH) || (cu && cu.team !== p.tm && p.z < CONFIG.cushionH);
    if (stop) { p.state = "gone"; p.left = 0; fluff(p.x, p.y, 10, cu ? TEAMS[cu.team].light : "#ffffff"); if (cu && isHost()) squashCushion(c); sfx("thump"); continue; }
    if (s >= 1) { p.state = "landed"; p.left = 0.6; fluff(p.x, p.y, 3, "#ffffff"); }

}
function fluff(x, y, n, color) {
  for (let k = 0; k < n; k++) feathers.push({ x, y, z: rnd(10, 30), vx: rnd(-80, 80), vy: rnd(-80, 80), vz: rnd(30, 120), r: rnd(0, 6), vr: rnd(-6, 6), life: rnd(1, 2.2), color });
  if (feathers.length > 400) feathers.splice(0, feathers.length - 400);
}
/** The victim's side: does a flying enemy pillow bonk body b? Called for me by me, and for each bot by the host. */
function checkBonks(b, myId, now) {
  if (b.st === "f") return;
  for (const p of pillows) {
    if (p.state !== "fly" || p.tm === b.team || p.z > CONFIG.lowZ || Math.hypot(p.x - b.x, p.y - b.y) > CONFIG.hitR) continue;
    p.state = "gone"; p.left = 0;
    b.vx += p.dx * CONFIG.knock; b.vy += p.dy * CONFIG.knock; b.stun = CONFIG.stun; b.hs++; b.by = p.by; b.lastHit = now;
    b.hp--; if (b.hp <= 0) { b.st = "f"; b.flopUntil = now + CONFIG.flopMs; }
    const m = { i: p.i, to: myId, by: p.by, x: Math.round(b.x), y: Math.round(b.y), f: b.st === "f" ? 1 : 0 };
    net.send("hit", m); bonkFx(m);
  }
}
function bonkFx(m) {
  const p = pillows.find((q) => q.i === m.i); if (p) { p.state = "gone"; p.left = 0; }
  fluff(m.x, m.y, m.f ? 22 : 12, "#ffffff"); words.push({ x: m.x, y: m.y - 30, text: m.f ? "FLOP!" : ["BONK!", "FWUMP!", "POOF!"][Math.floor(Math.random() * 3)], life: 0.9 });
  sfx(m.f ? "flop" : "bonk");
  if (m.to === net.sessionId) local.shake = 8;
}
const words = [];

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { wasHost: false, last: null, bots: new Map(), fort: EMPTY_FORT, fortId: 0, fortDirty: false, fortAt: 0, lastBots: 0, hs: new Map(), bonks: {}, bonkDirty: 0 };
/** The match as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() { const g = shared("game", null); return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g; }
function writeGame(g) {
  g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g));
  if (g.id !== local.gid || g.phase !== local.phase) onPhase(g); // the host sees its own change at once
  return g;
}
const teamOf = (g, id) => (isBot(id) ? (host.bots.get(id)?.team ?? (shared("bots", []).find((b) => b.i === id)?.t ?? 0)) : g.tm[id] ?? -1);
function hostTick(dt, now) {
  if (!host.wasHost) adopt();
  let g = game();
  const t = Date.now();
  if (!g) g = newMatch(null);
  g = seatNewcomers(g);
  if (g.phase === "build" && t >= g.endsAt) g = writeGame({ ...g, phase: "fight", endsAt: t + CONFIG.fightMs });
  else if (g.phase === "fight") g = fightTick(g, t);
  else if (g.phase === "over" && t >= g.endsAt) g = newMatch(g);
  botsTick(dt, g, now);
  if (host.fortDirty && now - host.fortAt > 120) { host.fortDirty = false; host.fortAt = now; net.setShared("fort", "m" + host.fortId + "|" + host.fort); }
}
/** Become host: take over the bots, the fort and the hit counts exactly as state has them. */
function adopt() {
  host.wasHost = true; host.bots.clear(); host.hs.clear(); host.bonks = {};
  const g = shared("game", null);
  if (g) { host.fort = sharedFort(g); host.fortId = g.id; }
  for (const b of shared("bots", [])) host.bots.set(b.i, { ...newBody(), id: b.i, name: b.n, cap: b.c, team: b.t, x: b.x, y: b.y, hp: b.hp, st: b.st === "f" ? "f" : "", flopUntil: performance.now() + 800, hs: b.hs, seenHs: b.hs, ...botTraits(b.i) });

  $("next").textContent = `Next match in ${Math.max(0, Math.ceil((g.endsAt - now) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(pointsOf(g, net.sessionId)); }
}
function showBoard(points) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (points > 0 ? board.submit(points).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No points yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "over") return; if (isHost()) playAgain(g); else net.send("again", {}); $("over").hidden = true; };
const playAgain = (g) => { if (g.phase === "over") writeGame({ ...g, endsAt: Math.min(g.endsAt, Date.now() + 1200) }); };
/** Two players picked the same cap color at once: the later sessionId picks again (bots' colors count too). */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botCaps = botList().map((b) => b.c);
  if (!others.some(([id, p]) => p.c === myCap && id < net.sessionId) && !botCaps.includes(myCap)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botCaps]);
  myCap = CAPS.find((c) => !taken.has(c)) || myCap; net.me.set("c", myCap);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
// Keyboard moves; the mouse aims (from the camera, so every edge of the room works) and a click throws.
// Touch: a floating stick on the left half moves; on the right half, drag to aim and let go to throw.
// In BUILD a click or tap on a cell places (or takes back) a cushion.
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const keys = new Set(), stick = { id: -1, x: 0, y: 0, mx: 0, my: 0 }, hover = { c: -1 };
const aim = { on: false, sx: 0, sy: 0, id: -1, world: () => toWorld(aim.sx, aim.sy) };
let throwQueued = null;
addEventListener("keydown", (e) => { unlockAudio(); keys.add(e.key.toLowerCase()); if (e.key === " ") { e.preventDefault(); if (aim.on) throwQueued = aim.world(); } });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  const out = { mx: k("d", "arrowright") - k("a", "arrowleft") + stick.mx, my: k("s", "arrowdown") - k("w", "arrowup") + stick.my, aimAt: aim.on ? aim.world() : null, throwAt: throwQueued };
  throwQueued = null; return out;
}
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  unlockAudio(); e.preventDefault();
  const g = game(); if (!g) return;
  if (g.phase === "build") { const w = toWorld(e.clientX, e.clientY), c = cellOf(w.x, w.y), team = g.tm[net.sessionId]; if (c < 0 || team === undefined) return; const fort = fortNow(); if (FORT_CH[team].includes(fort[c])) requestBuild("take", c); else if (canBuild(team, c) && fort[c] === ".") requestBuild("place", c); return; }
  if (e.pointerType === "mouse") { aim.on = true; aim.sx = e.clientX; aim.sy = e.clientY; throwQueued = aim.world(); return; }
  if (e.clientX < W / 2 && stick.id < 0) {
    cv.setPointerCapture(e.pointerId); Object.assign(stick, { id: e.pointerId, x: e.clientX, y: e.clientY, mx: 0, my: 0 });
    Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
  } else if (aim.id < 0) { cv.setPointerCapture(e.pointerId); Object.assign(aim, { id: e.pointerId, on: true, sx: e.clientX, sy: e.clientY }); }
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { aim.on = true; aim.sx = e.clientX; aim.sy = e.clientY; const w = toWorld(e.clientX, e.clientY); hover.c = cellOf(w.x, w.y); return; }
  if (e.pointerId === stick.id) { const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1); stick.mx = dx * k; stick.my = dy * k; $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.my * 35}px)`; }
  if (e.pointerId === aim.id) { aim.sx = e.clientX; aim.sy = e.clientY; }
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => {
  if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, my: 0 }); $("stick").hidden = true; }
  if (e.pointerId === aim.id) { if (ev === "pointerup") throwQueued = aim.world(); aim.id = -1; aim.on = false; }
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (S.shared.bots !== botsSeen.raw) botsSeen = { raw: S.shared.bots, at: t0 };
  let g = game();
  if (g && (g.id !== local.gid || g.phase !== local.phase)) onPhase(g);
  if (isHost()) hostTick(dt, t0); else host.wasHost = false;
  g = game();
  if (!g) return;
  stepPillows(dt, fortNow());
  myTick(dt, g, t0);
  const kids = everyone(g);
  draw(g, kids, dt, now);
  if (now - lastHud > 100) { lastHud = now; hud(g); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("throw", (m) => { if (m && typeof m === "object" && typeof m.x === "number") spawnPillow(m); });
  net.on("hit", (m) => { if (m && typeof m === "object") bonkFx(m); });
  net.on("flag", (m) => { if (m && typeof m === "object") flagFx(m); });
  net.on("build", (m, from) => { if (isHost()) applyBuild(from, m); });
  net.on("again", () => { const g = game(); if (isHost() && g) playAgain(g); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myCap = CAPS.find((c) => !taken.has(c)) || CAPS[Math.floor(Math.random() * CAPS.length)];
  net.me.set({ n: myName, c: myCap, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 8, buildMs: 1500, overMs: 2500, capsToWin: 99, botThrowCd: [0.45, 0.9] });
  if (new URLSearchParams(location.search).has("test")) window.__test = { game, me: () => me, kids: () => everyone(game()), fort: () => fortNow(), sid: () => net.sessionId, isHost, bots: () => [...host.bots.values()], pillows: () => pillows, config: CONFIG };
  if (new URLSearchParams(location.search).has("test")) Object.assign(window, { __camx: () => cam.x, __camy: () => cam.y, __camz: () => cam.z });
  requestAnimationFrame(frame);
})();
</script>
